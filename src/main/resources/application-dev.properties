server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Backend service URLs
services.identity.url=http://localhost:8081
services.organization.url=http://localhost:8082
services.workforce.url=http://localhost:8083

# Identity Service
spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=${services.identity.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/identity/**

# Organization Service
spring.cloud.gateway.server.webflux.routes[1].id=organization-service
spring.cloud.gateway.server.webflux.routes[1].uri=${services.organization.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/organization/**

# Workforce Service
spring.cloud.gateway.server.webflux.routes[2].id=workforce-service
spring.cloud.gateway.server.webflux.routes[2].uri=${services.workforce.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/workforce/**

# CORS - Angular development
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200,http://localhost:4201,http://localhost:4202
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true